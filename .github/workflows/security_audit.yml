name: Security Audit

on:
  pull_request:
  push:
    branches: [ "main" ]
  schedule:
    - cron: '30 1 * * 0'  # Run weekly on Sunday at 01:30 UTC

jobs:
  python-security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install security tools
        run: |
          pip install pip-audit bandit

      - name: Audit Python Dependencies (File API)
        run: |
          if [ -f quickstarts/file-api/requirements.txt ]; then
            pip-audit -r quickstarts/file-api/requirements.txt
          fi

      - name: Static Analysis with Bandit
        run: |
          # Recursive scan, skipping tests and hidden directories
          # -ll: Report only Medium and High severity issues
          bandit -r . -x ./tests,./.git,./.github,./venv,./.cursor -ll

  node-security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"

      - name: Audit Root NPM Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --ignore-scripts
            npm audit --audit-level=high
          fi

      - name: Audit File API NPM Dependencies
        working-directory: quickstarts/file-api
        run: |
          if [ -f package-lock.json ]; then
            npm ci --ignore-scripts
            npm audit --audit-level=high
          fi
